name: Test agent run with invalid API key
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          api-key: invalid-cursor-api-key-for-testing
          prompt: "Reply with the single word OK."
          permissions: read-write
          working-directory: .
          timeout: "60"
      - name: Assert agent failed and reported an error
        env:
          OUTCOME: ${{ steps.action.outcome }}
          EXIT_CODE: ${{ steps.action.outputs.exit-code }}
          STATUS: ${{ steps.action.outputs.status }}
        run: |
          echo "outcome: $OUTCOME"
          echo "exit-code: $EXIT_CODE"
          echo "status: $STATUS"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected the agent run to fail with an invalid API key"
            exit 1
          fi
          if [ -n "$EXIT_CODE" ] && [ "$EXIT_CODE" != "1" ]; then
            echo "FAIL: expected exit-code 1, got '$EXIT_CODE'"
            exit 1
          fi
          if [ -n "$STATUS" ]; then
            case "$STATUS" in
              error|cancelled) ;;
              *) echo "FAIL: unexpected status '$STATUS'"; exit 1 ;;
            esac
          fi
          echo "PASS"
