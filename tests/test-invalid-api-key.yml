name: Test agent run with an invalid Cursor API key
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          api-key: invalid-cursor-api-key-for-testing
          prompt: "Reply with the single word OK."
          permissions: read-only
          timeout: "60"
          cursor-version: "1.0.0"
      - name: Assert agent failed and reported error outputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
          EXIT_CODE: ${{ steps.action.outputs.exit-code }}
          STATUS: ${{ steps.action.outputs.status }}
        run: |
          echo "outcome: $OUTCOME"
          echo "exit-code: '$EXIT_CODE'"
          echo "status: '$STATUS'"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected the step to fail with an invalid API key"
            exit 1
          fi
          if [ "$EXIT_CODE" != "1" ]; then
            echo "FAIL: expected exit-code output '1'"
            exit 1
          fi
          case "$STATUS" in
            error|cancelled) ;;
            *) echo "FAIL: expected status 'error' or 'cancelled'"; exit 1 ;;
          esac
          echo "PASS"
