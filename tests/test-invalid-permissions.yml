name: Test invalid permissions input is rejected
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          api-key: invalid-cursor-api-key-for-testing
          prompt: "Say hello"
          permissions: admin
      - name: Assert validation failure
        env:
          OUTCOME: ${{ steps.action.outcome }}
          EXIT_CODE: ${{ steps.action.outputs.exit-code }}
        run: |
          echo "outcome: $OUTCOME"
          echo "exit-code: $EXIT_CODE"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for invalid permissions"
            exit 1
          fi
          if [ -n "$EXIT_CODE" ]; then
            echo "FAIL: expected no exit-code output (validation should fail before the agent runs)"
            exit 1
          fi
          echo "PASS"
