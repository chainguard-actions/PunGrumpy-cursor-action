name: Test invalid permissions input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          api-key: dummy-cursor-key-for-validation
          prompt: "Say hello"
          permissions: superuser
      - name: Assert action failed on invalid permissions before running the agent
        env:
          OUTCOME: ${{ steps.action.outcome }}
          EXIT_CODE: ${{ steps.action.outputs.exit-code }}
          STATUS: ${{ steps.action.outputs.status }}
        run: |
          echo "outcome: $OUTCOME"
          echo "exit-code: $EXIT_CODE"
          echo "status: $STATUS"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for invalid permissions"
            exit 1
          fi
          if [ -n "$EXIT_CODE" ] || [ -n "$STATUS" ]; then
            echo "FAIL: outputs should not be set when input validation fails"
            exit 1
          fi
          echo "PASS"
