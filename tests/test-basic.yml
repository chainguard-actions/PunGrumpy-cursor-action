name: Test basic usage (fake API key - graceful failure)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          api-key: "fake-api-key-for-testing"
          prompt: "Say hello"
          model: "default"
          timeout: "30"

      - name: Assert action ran and failed gracefully with expected outputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
          EXIT_CODE: ${{ steps.action.outputs.exit-code }}
          STATUS: ${{ steps.action.outputs.status }}
        run: |
          echo "outcome: $OUTCOME"
          echo "exit-code: $EXIT_CODE"
          echo "status: $STATUS"

          # The action must have run (not skipped)
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi

          # With a fake API key the action should fail
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (real API key may be available)"
            # If it succeeded, exit-code should be 0 and status should be finished
            if [ "$EXIT_CODE" != "0" ]; then
              echo "FAIL: expected exit-code=0 on success, got '$EXIT_CODE'"
              exit 1
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected with fake API key"
            # On failure, exit-code should be 1 and status should be error
            if [ "$EXIT_CODE" != "1" ]; then
              echo "FAIL: expected exit-code=1 on failure, got '$EXIT_CODE'"
              exit 1
            fi
            if [ "$STATUS" != "error" ]; then
              echo "FAIL: expected status=error on failure, got '$STATUS'"
              exit 1
            fi
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS"
