name: Test basic usage (fake API key)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          api-key: fake-api-key-for-testing
          prompt: "Say hello"
          model: default
          timeout: "30"

      - name: Assert outputs are set and action failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          EXIT_CODE: ${{ steps.action.outputs.exit-code }}
          STATUS: ${{ steps.action.outputs.status }}
        run: |
          echo "outcome: $OUTCOME"
          echo "exit-code: $EXIT_CODE"
          echo "status: $STATUS"

          # The action should fail (fake API key) but gracefully
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (unexpected but valid if SDK accepted the key)"
            if [ "$EXIT_CODE" != "0" ] && [ "$EXIT_CODE" != "" ]; then
              echo "INFO: exit-code=$EXIT_CODE"
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully with fake API key"
            # Verify that exit-code and status outputs were set before setFailed
            if [ -n "$EXIT_CODE" ]; then
              echo "PASS: exit-code output was set: $EXIT_CODE"
            else
              echo "INFO: exit-code output not set (setFailed called before setOutputs)"
            fi
            if [ -n "$STATUS" ]; then
              echo "PASS: status output was set: $STATUS"
            else
              echo "INFO: status output not set (setFailed called before setOutputs)"
            fi
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
