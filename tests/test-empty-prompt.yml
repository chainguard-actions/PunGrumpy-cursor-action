name: Test empty prompt input validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          api-key: "fake-api-key-for-testing"
          prompt: "   "

      - name: Assert action failed with validation error for whitespace-only prompt
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"

          # The action must fail because a whitespace-only prompt is invalid
          # The input.ts code checks: if (!prompt.trim()) throw new Error(...)
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly rejected whitespace-only prompt"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have rejected whitespace-only prompt"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
