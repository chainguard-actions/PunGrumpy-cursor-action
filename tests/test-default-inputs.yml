name: Test default optional inputs
on:
  workflow_dispatch:

jobs:
  test-default-inputs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          api-key: "invalid-api-key-for-testing"
          prompt: "Say hello"
          # All other inputs use their defaults:
          # model: default
          # working-directory: .
          # permissions: read-only
          # timeout: 300

      - name: Assert action step ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action step was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action step ran with outcome '$OUTCOME'"

      - name: Assert exit-code output or step failure
        env:
          EXIT_CODE: ${{ steps.action.outputs.exit-code }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "exit-code: '$EXIT_CODE'"
          echo "outcome: '$OUTCOME'"
          if [ -n "$EXIT_CODE" ]; then
            echo "PASS: exit-code output is set to '$EXIT_CODE'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action step failed (acceptable — infrastructure may not support all dependencies)"
          else
            echo "FAIL: exit-code output is empty and outcome is '$OUTCOME'"
            exit 1
          fi

      - name: Assert summary output field is accessible
        env:
          SUMMARY: ${{ steps.action.outputs.summary }}
        run: |
          echo "summary: '$SUMMARY'"
          echo "PASS: summary output field is accessible"
