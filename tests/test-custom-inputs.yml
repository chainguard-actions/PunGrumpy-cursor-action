name: Test custom inputs (working-directory, model, permissions)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a working subdirectory
        run: mkdir -p /tmp/cursor-workdir

      - id: action
        uses: .
        continue-on-error: true
        with:
          api-key: fake-api-key-for-testing
          prompt: "List files in the current directory"
          model: "default"
          working-directory: "/tmp/cursor-workdir"
          permissions: "read-write"
          timeout: "30"

      - name: Assert action ran with custom inputs (fails gracefully on fake key)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          EXIT_CODE: ${{ steps.action.outputs.exit-code }}
          STATUS: ${{ steps.action.outputs.status }}
        run: |
          echo "outcome: $OUTCOME"
          echo "exit-code: $EXIT_CODE"
          echo "status: $STATUS"

          # The action should either succeed (unlikely with fake key) or fail gracefully.
          # Either way, it must NOT fail with an input validation error (permissions/timeout are valid).
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with custom inputs"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with fake API key)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
